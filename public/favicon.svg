<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Kristiansund walking tour app icon</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Minimalist app icon with a lighthouse and winding path on a teal background, Scandinavian flat design style</desc>

  <defs>
    <clipPath id="roundedSquare">
      <rect x="140" y="40" width="400" height="400" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <!-- App icon background -->
  <rect x="140" y="40" width="400" height="400" rx="88" ry="88" fill="#1A7B8C" style="fill:rgb(26, 123, 140);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Subtle secondary zone — horizon band -->
  <rect x="140" y="270" width="400" height="170" rx="0" ry="0" fill="#155F6E" clip-path="url(#roundedSquare)" style="fill:rgb(21, 95, 110);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Rounded bottom of background restored via a clipped rect for horizon area -->
  <rect x="140" y="330" width="400" height="110" rx="0" fill="#155F6E" clip-path="url(#roundedSquare)" style="fill:rgb(21, 95, 110);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Path / route line: winding from bottom-left to upper area -->
  <polyline points="210,380 255,340 270,300 295,265 320,235" fill="none" stroke="#E8F4F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" clip-path="url(#roundedSquare)" style="fill:none;stroke:rgb(232, 244, 246);color:rgb(251, 251, 254);stroke-width:8px;stroke-linecap:round;stroke-linejoin:round;opacity:0.45;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lighthouse base tower -->
  <rect x="317" y="170" width="26" height="70" rx="4" fill="#F2F8FA" style="fill:rgb(242, 248, 250);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lighthouse mid stripe (coral accent) -->
  <rect x="317" y="200" width="26" height="12" rx="0" fill="#E8705A" style="fill:rgb(232, 112, 90);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lighthouse top cap -->
  <rect x="310" y="162" width="40" height="12" rx="3" fill="#F2F8FA" style="fill:rgb(242, 248, 250);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lighthouse lantern room -->
  <rect x="319" y="148" width="22" height="18" rx="3" fill="#F2F8FA" style="fill:rgb(242, 248, 250);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lantern window glow -->
  <rect x="323" y="152" width="14" height="10" rx="2" fill="#FFD97A" opacity="0.9" style="fill:rgb(255, 217, 122);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Light beam — subtle triangle pointing upper-right -->
  <polygon points="330,148 370,110 375,120 335,148" fill="#FFD97A" opacity="0.22" clip-path="url(#roundedSquare)" style="fill:rgb(255, 217, 122);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.22;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Light beam left -->
  <polygon points="330,148 285,112 292,102 332,148" fill="#FFD97A" opacity="0.15" clip-path="url(#roundedSquare)" style="fill:rgb(255, 217, 122);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.15;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lighthouse base platform -->
  <rect x="305" y="240" width="50" height="8" rx="4" fill="#CBE8EE" opacity="0.7" style="fill:rgb(203, 232, 238);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Path dots (waypoints) -->
  <circle cx="210" cy="380" r="7" fill="#E8705A" style="fill:rgb(232, 112, 90);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="255" cy="340" r="5" fill="#E8F4F6" opacity="0.7" style="fill:rgb(232, 244, 246);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="295" cy="265" r="5" fill="#E8F4F6" opacity="0.7" style="fill:rgb(232, 244, 246);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="320" cy="235" r="5" fill="#E8705A" opacity="0.85" style="fill:rgb(232, 112, 90);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Water ripple lines bottom area -->
  <line x1="175" y1="360" x2="230" y2="360" stroke="#CBE8EE" stroke-width="2.5" stroke-linecap="round" opacity="0.35" style="fill:rgb(0, 0, 0);stroke:rgb(203, 232, 238);color:rgb(251, 251, 254);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="170" y1="375" x2="215" y2="375" stroke="#CBE8EE" stroke-width="2" stroke-linecap="round" opacity="0.25" style="fill:rgb(0, 0, 0);stroke:rgb(203, 232, 238);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.25;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="385" y1="355" x2="455" y2="355" stroke="#CBE8EE" stroke-width="2.5" stroke-linecap="round" opacity="0.3" style="fill:rgb(0, 0, 0);stroke:rgb(203, 232, 238);color:rgb(251, 251, 254);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="395" y1="370" x2="450" y2="370" stroke="#CBE8EE" stroke-width="2" stroke-linecap="round" opacity="0.2" style="fill:rgb(0, 0, 0);stroke:rgb(203, 232, 238);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.2;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

</svg>